<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>泡饼丝的个人主页</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #ffffff;
      background: linear-gradient(135deg, #050505, #071b3d, #0b4f8a);
    }

    .card {
      width: 100%;
      max-width: 680px;
      padding: 48px 36px;
      text-align: center;
      border: 1px solid rgba(120, 190, 255, 0.35);
      border-radius: 28px;
      background: rgba(5, 15, 35, 0.78);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    }

    .tag {
      display: inline-block;
      padding: 8px 14px;
      color: #8ed0ff;
      border: 1px solid rgba(142, 208, 255, 0.45);
      border-radius: 999px;
      font-size: 14px;
    }

    h1 {
      margin: 20px 0 12px;
      font-size: 48px;
    }

    p {
      color: #d9eaff;
      font-size: 18px;
      line-height: 1.8;
    }

    .button {
      display: inline-block;
      margin-top: 22px;
      padding: 13px 26px;
      color: #04152d;
      background: #8ed0ff;
      border-radius: 999px;
      text-decoration: none;
      font-weight: bold;
    }

    .button:hover {
      background: #ffffff;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="tag">我的第一个 AI 编程项目</span>
    <h1>你好，我是泡饼丝</h1>
    <p>我正在学习 AI 编程，希望做出自己的工具。</p>
    <a class="button" href="#about">认识我</a>
  </main>
</body>
</html>
