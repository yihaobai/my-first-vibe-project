<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的个人主页</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .card {
      width: 90%;
      max-width: 600px;
      padding: 40px;
      text-align: center;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      line-height: 1.8;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      color: #5b4bb7;
      background: white;
      border-radius: 999px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>你好，我是小明</h1>
    <p>这是我的第一个 AI 编程网页。</p>
    <p>我正在学习如何使用 GitHub 和 Vibe Coding。</p>
    <a class="button" href="mailto:example@email.com">联系我</a>
  </main>
</body>
</html>
